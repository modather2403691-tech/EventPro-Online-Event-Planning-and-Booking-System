<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPro - Book Event</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">EventPro</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Book Your Event</h1>

    <div class="form-container">
      <form id="bookingForm">

        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name">
          <small class="error" id="nameError"></small>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
          <small class="error" id="emailError"></small>
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone">
          <small class="error" id="phoneError"></small>
        </div>

        <div>
          <label for="eventType">Event Type</label>
          <select id="eventType" name="eventType">
            <option value="">Select Event Type</option>
            <option value="Wedding">Wedding</option>
            <option value="Conference">Conference</option>
            <option value="Birthday">Birthday</option>
          </select>
          <small class="error" id="eventTypeError"></small>
        </div>

        <div>
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" name="eventDate">
          <small class="error" id="dateError"></small>
        </div>

        <div>
          <label for="guests">Number of Guests</label>
          <input type="number" id="guests" name="guests">
          <small class="error" id="guestsError"></small>
        </div>

        <div>
          <label>Additional Services</label>
          <div class="checkbox-group">
            <label><input type="checkbox" class="service" value="100"> Decoration (+$100)</label>
            <label><input type="checkbox" class="service" value="150"> Catering (+$150)</label>
            <label><input type="checkbox" class="service" value="120"> Photography (+$120)</label>
          </div>
        </div>

        <div>
          <label for="notes">Additional Notes</label>
          <textarea id="notes" name="notes" rows="4"></textarea>
        </div>

        <div>
          <h3>Total Price: $<span id="totalPrice">500</span></h3>
        </div>

        <button type="submit">Submit Booking</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 EventPro. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
