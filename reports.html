  <!-- CSS -->

<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="manage-users.html">Manage Users</a></li>

    <!-- Main Content -->
    <div class="dashboard-content">
      <h1>Reports</h1>

      <!-- Cards -->
      <div class="cards">
        <div class="card">
          <h3>Monthly Bookings</h3>
          <p>12</p>
        </div>

        <div class="card">
          <h3>Completed Events</h3>

          <h3>Estimated Revenue</h3>

        </div>
      </div>

      <!-- Report Table -->
      <section class="dashboard-section">
        <h2>Report Summary</h2>

        <table class="dashboard-table">
          <thead>
            <tr>
              <th>Month</th>
              <th>Total Bookings</th>
              <th>Completed</th>
              <th>Pending</th>
              <th>Revenue</th>

              <td>March</td>
              <td>8</td>
              <td>6</td>

              <td>April</td>
              <td>10</td>
              <td>7</td>
              <td>3</td>
              <td>$5,600</td>
            </tr>

            <tr>
              <td>May</td>
              <td>12</td>
              <td>9</td>
              <td>3</td>
              <td>$8,500</td>
            </tr>
          </tbody>
        </table>

      </section>

    </div>
  </div>

  <!-- JS -->
  <script src="js/main.js"></script>
