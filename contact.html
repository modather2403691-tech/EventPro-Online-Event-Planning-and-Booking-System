<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPro - Contact</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="contact-page">

<header>
  <nav class="navbar">
    <div class="logo">EventPro</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="packages.html">Packages</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Contact Us</h1>
  <p style="text-align:center; color:white; margin-bottom: 25px;">
    Please fill in the form below and we will get back to you as soon as possible.
  </p>

  <div class="form-container">
    <form>
      <div>
        <label>Name</label>
        <input type="text" placeholder="Enter your name" required>
      </div>

      <div>
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div>
        <label>Message</label>
        <textarea rows="4" placeholder="Write your message..." required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </div>
</main>
<footer class="footer">
  <p>&copy; 2025 EventPro</p>
</footer>

</body>
</html>
